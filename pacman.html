<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pacman - Somnia Christmas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at top, #0b3d2e, #020b06);
      color: white;
      font-family: Trebuchet MS, sans-serif;
    }

    /* ❄️ Snow */
    .snow {
      position: absolute;
      top: -10px;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: fall linear infinite;
      z-index: 999;
    }

    @keyframes fall {
      to { transform: translateY(120vh); }
    }

    /* 🎮 Game Container */
    #gameContainer {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
    }

    #gameBox {
      width: 420px;
      height: 460px;
      border: 4px solid #00ffae;
      box-shadow: 0 0 20px green;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }

    #uiBar {
      margin-top: 12px;
      font-size: 16px;
    }

    button {
      margin-top: 14px;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, red, green);
      color: white;
    }
  </style>
</head>
<body>

<!-- ❄️ SNOW -->
<script>
  for (let i = 0; i < 40; i++) {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
    document.body.appendChild(snow);
  }
</script>

<div id="gameContainer">
  <h2>🎄 SOMNIA PACMAN CHRISTMAS 🎄</h2>

  <div id="gameBox">
    🚧 PACMAN ENGINE DISAMBUNG DI SINI
  </div>

  <div id="uiBar">
    Player: <span id="playerName"></span>
  </div>

  <button onclick="mockFinish()">FINISH GAME (TEST)</button>
</div>

<script>
  // ambil nama dari menu
  const name = localStorage.getItem("displayName") || "Player";
  document.getElementById("playerName").innerText = name;

  // simulasi game selesai (nanti diganti submit onchain)
  function mockFinish() {
    const score = Math.floor(Math.random() * 3000);
    alert("Game Over!\nScore: " + score);

    // nanti di sini kamu ganti ke submitScore onchain
    console.log("Submit score:", score);
  }
</script>

</body>
</html>
