<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>
</head>
<body>
<h2>LEADERBOARD</h2>
<ul id="leaderList"></ul>
<script src="libs/ethers.min.js"></script>
<script>
const contractAddress="0xYourContractAddress";
const abi=["function getLeaderboard() view returns(address[] memory,uint256[] memory)"];
async function loadLeaderboard(){
  if(!window.ethereum){ alert("No wallet provider found"); return; }
  const provider=new ethers.BrowserProvider(window.ethereum);
  const contract=new ethers.Contract(contractAddress, abi, provider);
  const [addresses,scores]=await contract.getLeaderboard();
  const ul=document.getElementById("leaderList"); ul.innerHTML="";
  for(let i=0;i<addresses.length;i++){
    const li=document.createElement("li");
    li.textContent=addresses[i]+" - "+scores[i];
    ul.appendChild(li);
  }
}
window.addEventListener("load", loadLeaderboard);
</script>
</body>
</html>
