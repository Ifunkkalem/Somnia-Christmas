<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎄 Somnia Christmas Pac-Man 🎄</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Trebuchet MS',sans-serif;}
  body{width:100vw;height:100vh;display:flex;overflow:hidden;
       background: linear-gradient(to right, #ffffff, #ff0000);
       color:white; position:relative;}

  /* ❄️ Snow Animation */
  .snow{position:absolute;top:-10px;width:8px;height:8px;background:white;
        border-radius:50%;opacity:0.8;animation:snowFall linear infinite;}
  @keyframes snowFall{from{transform:translateY(0);}to{transform:translateY(120vh);}}

  /* Sidebar Kiri */
  #sidebar{
    width:150px;background:#ffffff;border-right:3px solid #00ffae;
    padding:15px;display:flex;flex-direction:column;gap:12px;color:black;
  }
  #sidebar button{
    padding:10px;font-size:13px;font-weight:bold;border:none;border-radius:10px;
    background: linear-gradient(90deg, red, green);color:white;cursor:pointer;transition:0.2s;
  }
  #sidebar button:hover{transform:scale(1.05);box-shadow:0 0 10px red;}
  #walletStatus{margin-top:8px;font-size:12px;color:#00ffae;}

  /* Konten Kanan */
  #mainContent{
    flex:1;position:relative;display:flex;justify-content:flex-start;align-items:center;
    flex-direction:column;overflow:hidden;
    background: linear-gradient(to bottom, #ff0000, #800000);
    text-align:center;
    color:white;
    padding-top:20px;
  }
  #previewImage{
    max-width:70%;max-height:60%;
    border:5px solid #00ffae;border-radius:15px;box-shadow:0 0 25px #00ffae;
  }
  iframe{width:70%;height:60%;border:none;border-radius:15px;display:none;}

  /* Header Judul */
  #headerTitle{
    font-size:36px;
    color:#00ffae;
    text-shadow:0 0 10px yellow,0 0 20px white;
    font-weight:bold;
    margin-bottom:20px;
  }

  /* Footer Neon */
  #footer{
    margin-top:auto;
    font-size:16px;
    display:flex;flex-direction:column;gap:5px;align-items:center;
    color:#fff;
    margin-bottom:20px;
    text-shadow: 0 0 5px #00ffae, 0 0 10px #00ffae, 0 0 20px #00ffae, 0 0 40px #00ffae;
    font-weight:bold;
  }
</style>
</head>
<body>

<!-- Sidebar Kiri -->
<div id="sidebar">
  <button onclick="connectWallet()">Connect Wallet</button>
  <div id="walletStatus">Wallet: Not connected</div>
  <button onclick="showGame()">Play Game</button>
  <button onclick="showLeaderboard()">Leaderboard</button>
</div>

<!-- Konten Kanan -->
<div id="mainContent">
  <div id="headerTitle">🎄 Somnia Christmas Pac-Man 🎄</div>

  <!-- Preview Pac-Man -->
  <img id="previewImage" src="assets/pacman_preview.png" alt="Pac-Man Christmas">

  <!-- Game iframe -->
  <iframe id="gameFrame" src="pacman_natal.html"></iframe>

  <!-- Leaderboard iframe -->
  <iframe id="leaderboardFrame" src="leaderboard.html"></iframe>

  <!-- Footer Creator -->
  <div id="footer">
    created by:<br>
    @ifunkkalem<br>
    @Ifunkkalem91
  </div>
</div>

<!-- ❄️ Snow Animation Script -->
<script>
for(let i=0;i<50;i++){
  const snow=document.createElement("div");
  snow.className="snow";
  snow.style.left=Math.random()*100+"vw";
  snow.style.animationDuration=(Math.random()*5+5)+"s";
  snow.style.opacity=Math.random();
  document.body.appendChild(snow);
}
</script>

<!-- Ethers.js -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>
let walletAddress = localStorage.getItem("walletAddress") || null;
let walletBalance = 0;

const walletStatus = document.getElementById("walletStatus");
const previewImage = document.getElementById("previewImage");
const gameFrame = document.getElementById("gameFrame");
const leaderboardFrame = document.getElementById("leaderboardFrame");

// ==================== Connect Wallet ====================
async function connectWallet(){
  if(window.ethereum){
    try{
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      const signer = provider.getSigner();
      walletAddress = await signer.getAddress();
      localStorage.setItem("walletAddress", walletAddress);
      window.walletAddress = walletAddress;

      // Ambil balance $SOMI dari contract ERC-20
      const somiContractAddress = "0xYourSomiTokenAddressHere";
      const somiAbi = ["function balanceOf(address owner) view returns (uint256)","function decimals() view returns (uint8)"];
      const contract = new ethers.Contract(somiContractAddress, somiAbi, provider);
      const decimals = await contract.decimals();
      const rawBalance = await contract.balanceOf(walletAddress);
      walletBalance = Number(ethers.utils.formatUnits(rawBalance, decimals));

      walletStatus.innerHTML = `Wallet: ${walletAddress}<br>Balance: ${walletBalance} $SOMI`;
      alert("Wallet Connected!");
    }catch(err){
      console.error(err);
      alert("Failed to connect wallet!");
    }
  }else{
    alert("No wallet detected! Install MetaMask or compatible wallet.");
  }
}

// ==================== Show Game ====================
function showGame(){
  previewImage.style.display = "none";
  leaderboardFrame.style.display = "none";
  gameFrame.style.display = "block";
}

// ==================== Show Leaderboard ====================
function showLeaderboard(){
  previewImage.style.display = "none";
  gameFrame.style.display = "none";
  leaderboardFrame.style.display = "block";
  leaderboardFrame.src = "leaderboard.html?" + Date.now();
}
</script>

</body>
</html>
