<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Somnia Christmas - Pacman Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="libs/ethers.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Trebuchet MS',sans-serif;}
body{width:100vw;height:100vh;overflow:hidden;background:linear-gradient(to right,#fff,#ff0000);color:#fff;}
#container{display:flex;height:100%;width:100%;}
#sidebar{width:150px;background:#fff;color:black;padding:10px;display:flex;flex-direction:column;gap:10px;}
#main{flex:1;background:red;position:relative;display:flex;flex-direction:column;align-items:center;}
#title{font-size:32px;color:#00ffae;text-shadow:0 0 10px red,0 0 20px green;margin-top:20px;text-align:center;}
#walletDisplay,#walletBalance{font-size:14px;margin-top:5px;}
button{padding:10px;border:none;border-radius:8px;background:linear-gradient(90deg,red,green);color:white;cursor:pointer;}
iframe{flex:1;width:100%;border:none;margin-top:10px;display:none;}
footer{position:absolute;bottom:5px;color:#0ff;text-shadow:0 0 5px #0ff;font-size:14px;text-align:center;width:100%;}
.snow{position:absolute;top:-10px;width:8px;height:8px;background:white;border-radius:50%;opacity:0.8;animation:snowFall linear infinite;}
@keyframes snowFall{from{transform:translateY(0);}to{transform:translateY(120vh);}}
</style>
</head>
<body>
<div id="container">

  <!-- Sidebar Kiri -->
  <div id="sidebar">
    <button id="connectWalletBtn">Connect Wallet</button>
    <div id="walletDisplay">Wallet: Not Connected</div>
    <div id="walletBalance">Balance: 0 $SOMI</div>
    <button id="playBtn">Play Game</button>
    <button id="leaderboardBtn">Leaderboard</button>
  </div>

  <!-- Main Kanan -->
  <div id="main">
    <div id="title">☃️ SOMNIA CHRISTMAS CARNIVAL 🎄</div>
    <iframe id="gameFrame" src=""></iframe>
    <iframe id="leaderboardFrame" src=""></iframe>
    <footer>Created by: @ifunkkalem | @ifunkkalem91</footer>
  </div>

</div>

<!-- Snow Effect -->
<script>
for(let i=0;i<35;i++){
  const snow=document.createElement("div");
  snow.className="snow";
  snow.style.left=Math.random()*100+"vw";
  snow.style.animationDuration=(Math.random()*5+5)+"s";
  snow.style.opacity=Math.random();
  document.body.appendChild(snow);
}
</script>

<script>
let walletAddress=null;
let provider, signer;
const somiContractAddress="0xYourSomiContractAddressHere"; // Ganti contract $SOMI
const leaderboardContractAddress="0xYourLeaderboardContractHere"; // Ganti contract leaderboard
const abi=[ "function balanceOf(address owner) view returns (uint256)", "function transfer(address to,uint256 amount) returns (bool)" ];

const connectBtn=document.getElementById("connectWalletBtn");
const walletDisplay=document.getElementById("walletDisplay");
const balanceDisplay=document.getElementById("walletBalance");
const playBtn=document.getElementById("playBtn");
const gameFrame=document.getElementById("gameFrame");
const leaderboardBtn=document.getElementById("leaderboardBtn");
const leaderboardFrame=document.getElementById("leaderboardFrame");

// Connect wallet
connectBtn.addEventListener("click",async()=>{
  if(!window.ethereum){alert("Please install MetaMask or EVM wallet!"); return;}
  try{
    provider=new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts",[]);
    signer=await provider.getSigner();
    walletAddress=await signer.getAddress();
    walletDisplay.innerText=walletAddress;

    const contract=new ethers.Contract(somiContractAddress,abi,provider);
    const balance=await contract.balanceOf(walletAddress);
    balanceDisplay.innerText=ethers.formatUnits(balance,18)+" $SOMI";
    alert("Wallet connected and balance loaded!");
  }catch(err){console.error(err);alert("Failed to connect wallet!");}
});

// Pay to Play
playBtn.addEventListener("click",async()=>{
  if(!walletAddress){alert("Connect wallet first!");return;}
  try{
    const contract=new ethers.Contract(somiContractAddress,abi,signer);
    const tx=await contract.transfer(leaderboardContractAddress,ethers.parseUnits("0.01",18));
    await tx.wait();
    alert("Payment successful! Game will start.");

    // Load game
    gameFrame.src="Pacman/pacman_natal.html";
    gameFrame.style.display="block";
    leaderboardFrame.style.display="none";
  }catch(err){console.error(err);alert("Payment failed!");}
});

// Leaderboard
leaderboardBtn.addEventListener("click",()=>{
  leaderboardFrame.src="leaderboard.html";
  leaderboardFrame.style.display="block";
  gameFrame.style.display="none";
});
</script>
</body>
</html>
