<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Somnia Halloween — Pacman (Mainnet)</title>
  <link rel="stylesheet" href="Pacman/pacman.css" />
  <style>
    /* simple menu styling (orange/purple) */
    body{margin:0;font-family:Arial;background:radial-gradient(circle at top,#2b0033,#0a0010);color:#fff;height:100vh;overflow:hidden}
    .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,95vw)}
    .menu{background:rgba(20,0,30,0.85);border:2px solid orange;padding:20px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
    .menu h1{color:orange;margin-bottom:6px;text-align:center}
    .menu p{color:#c77dff;text-align:center;margin-bottom:14px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    button{flex:1;padding:12px;border-radius:8px;border:none;font-weight:700;cursor:pointer;background:linear-gradient(90deg,orange,purple);color:#fff}
    .small{flex:0 0 160px}
    #live-indicator{float:right;padding:6px 10px;border-radius:8px;background:#442; color:#fdd;}
    #addr-display{font-size:13px;color:#ddd; margin-top:8px}
    iframe{width:100%;height:64vh;border-radius:10px;border:0;background:#000}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="center">
    <div class="menu" id="menuScreen">
      <h1>WELCOME SOMNIA HALLOWEEN</h1>
      <p>PAC-MAN EDITION — MAINNET</p>

      <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
        <div style="flex:1">
          <input id="displayNameInput" maxlength="12" placeholder="Display name (max 12)" style="width:100%;padding:10px;border-radius:8px;border:none;text-align:center"/>
        </div>
        <div>
          <button id="btn-connect" class="small">Connect Wallet</button>
        </div>
      </div>

      <div id="addr-display">Not connected</div>
      <div style="margin-top:12px" class="row">
        <button onclick="openPlay()">PLAY</button>
        <button onclick="openLeaderboard()">LEADERBOARD</button>
        <button onclick="quitGame()">QUIT</button>
      </div>
    </div>

    <div id="playScreen" class="hidden">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button onclick="backToMenu()" style="flex:0 0 120px">Back</button>
        <div style="flex:1"></div>
        <div id="live-indicator" class="">OFFLINE</div>
      </div>
      <iframe id="pacman-iframe" src="Pacman/pacman.html"></iframe>
    </div>

    <div id="leaderboardScreen" class="hidden">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button onclick="backToMenu()" style="flex:0 0 120px">Back</button>
        <div style="flex:1"></div>
        <div id="live-indicator-2"></div>
      </div>
      <iframe id="leaderboard-iframe" src="leaderboard.html"></iframe>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="libs/ethers.min.js"></script>
  <script src="web3.js"></script>
  <script src="app.js"></script>

  <script>
    // simple menu functions
    const nameInput = document.getElementById("displayNameInput");
    const stored = localStorage.getItem("displayName");
    if (stored) nameInput.value = stored;

    function openPlay(){
      const v = nameInput.value.trim();
      if (!v) { alert("Isi display name dulu (max 12)."); return; }
      if (v.length>12) { alert("Max 12 char"); return; }
      localStorage.setItem("displayName", v);
      document.getElementById("menuScreen").classList.add("hidden");
      document.getElementById("playScreen").classList.remove("hidden");
    }
    function openLeaderboard(){
      document.getElementById("menuScreen").classList.add("hidden");
      document.getElementById("leaderboardScreen").classList.remove("hidden");
      // ask leaderboard iframe to refresh
      document.getElementById("leaderboard-iframe").contentWindow && document.getElementById("leaderboard-iframe").contentWindow.postMessage({type:'REFRESH_TOP10'},"*");
    }
    function backToMenu(){
      document.getElementById("menuScreen").classList.remove("hidden");
      document.getElementById("playScreen").classList.add("hidden");
      document.getElementById("leaderboardScreen").classList.add("hidden");
    }
    function quitGame(){
      window.open("about:blank","_self"); window.close();
    }

    // show address on connect (web3.js will call afterWalletConnected)
    window.afterWalletConnected = function(addr){
      document.getElementById("addr-display").innerText = addr || "Connected";
      document.getElementById("live-indicator").innerText = "ONLINE";
      document.getElementById("live-indicator").style.background = "#144";
      // propagate to iframe
      const pac = document.getElementById("pacman-iframe");
      if (pac && pac.contentWindow) pac.contentWindow.postMessage({type:'WALLET_CONNECTED', address:addr, displayName: localStorage.getItem("displayName") || "" }, "*");
    };
  </script>
</body>
</html>
