<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Somnia Christmas - Pacman Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Trebuchet MS', sans-serif; }
    body {
      width:100vw; height:100vh; overflow:hidden; background: radial-gradient(circle at top, #0b3d2e, #020b06);
      color:#fff; position:relative;
    }

    /* ❄️ Snow */
    .snow { position:absolute; top:-10px; width:8px; height:8px; background:white; border-radius:50%; opacity:0.8; animation:snowFall linear infinite; }
    @keyframes snowFall { from {transform:translateY(0);} to {transform:translateY(120vh);} }

    /* ✨ Stars */
    .star { position:absolute; width:3px; height:3px; background:yellow; border-radius:50%; opacity:0.7; animation:twinkle 2s infinite alternate; }
    @keyframes twinkle { from{opacity:0.3;} to{opacity:1;} }

    /* 🎄 Christmas Lights */
    .lights span { display:inline-block; width:15px; height:15px; margin:0 4px; border-radius:50%; background-color:red; animation:blink 1.5s infinite; }
    .lights span:nth-child(2n){ background-color:yellow; animation-delay:0.3s; }
    .lights span:nth-child(3n){ background-color:green; animation-delay:0.6s; }
    @keyframes blink {0%,50%,100%{opacity:1;}25%,75%{opacity:0.2;}}

    .screen { width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10; position:relative; text-align:center; }
    h1 { font-size:42px; color:#00ffae; text-shadow:0 0 10px red, 0 0 20px green; margin-bottom:8px; }
    h2 { font-size:22px; color:#fff; margin-bottom:30px; }

    .menu-box { background: rgba(5,30,20,0.85); border:2px solid #00ffae; border-radius:18px; padding:30px 40px; box-shadow:0 0 25px green; min-width:320px; }
    .menu-box input { width:100%; padding:12px; border-radius:10px; border:none; margin-bottom:18px; text-align:center; font-size:16px; outline:none; }
    .menu-box button { width:100%; padding:14px; margin:8px 0; font-size:16px; font-weight:bold; border:none; border-radius:12px; cursor:pointer; background:linear-gradient(90deg, #ff0000, #00ff7f); color:white; transition:0.2s; }
    .menu-box button:hover { transform:scale(1.05); box-shadow:0 0 15px red; }

    .hidden { display:none !important; }

    iframe { width:100%; height:100%; border:none; background:black; border:5px solid #00ffae; border-radius:15px; box-shadow:0 0 25px red; }

    .back-btn { position:absolute; top:15px; left:15px; z-index:9999; padding:10px 18px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; background:linear-gradient(90deg, red, green); color:white; }

    /* ✨ Button Sound Active */
    button:active { transform:scale(0.95); }
  </style>
</head>
<body>

<!-- ❄️ Snow + Stars -->
<script>
  for(let i=0;i<40;i++){
    const snow=document.createElement("div"); snow.className="snow";
    snow.style.left=Math.random()*100+"vw"; snow.style.animationDuration=(Math.random()*5+5)+"s"; snow.style.opacity=Math.random();
    document.body.appendChild(snow);
  }
  for(let i=0;i<60;i++){
    const star=document.createElement("div"); star.className="star";
    star.style.left=Math.random()*100+"vw"; star.style.top=Math.random()*80+"vh";
    star.style.width=star.style.height=(Math.random()*3+1)+"px"; star.style.animationDuration=(1+Math.random()*2)+"s";
    document.body.appendChild(star);
  }
</script>

<!-- 🎄 MAIN MENU -->
<div id="menuScreen" class="screen">
  <div class="lights"><span></span><span></span><span></span><span></span><span></span></div>
  <h1>☃️ SOMNIA CHRISTMAS CARNIVAL</h1>
  <h2>PAC-MAN EDITION 🎄</h2>

  <div class="menu-box">
    <input id="displayNameInput" type="text" maxlength="12" placeholder="Enter Display Name (Max 12)" />
    <button onclick="saveName(); playSound()">SAVE DISPLAY NAME</button>
    <button onclick="openPlay(); playSound()">PLAY</button>
    <button onclick="openLeaderboard(); playSound()">LEADERBOARD</button>
    <button onclick="quitGame(); playSound()">QUIT</button>
  </div>
</div>

<!-- 🎮 PLAY SCREEN -->
<div id="playScreen" class="screen hidden">
  <button class="back-btn" onclick="goBack(); playSound()">⬅ BACK</button>
  <iframe id="gameFrame" src="pacman.html"></iframe>
</div>

<!-- 🏆 LEADERBOARD SCREEN -->
<div id="leaderboardScreen" class="screen hidden">
  <button class="back-btn" onclick="goBack(); playSound()">⬅ BACK</button>
  <iframe id="leaderFrame" src="leaderboard.html"></iframe>
</div>

<script>
  // Sound effect
  const clickSound=new Audio("click-jingle.mp3");
  function playSound(){ clickSound.currentTime=0; clickSound.play(); }

  const nameInput=document.getElementById("displayNameInput");
  const savedName=localStorage.getItem("displayName");
  if(savedName) nameInput.value=savedName;

  function saveName(){ let name=nameInput.value.trim(); if(name.length===0){alert("Nama tidak boleh kosong!");return;} if(name.length>12){alert("Max 12 karakter!");return;} localStorage.setItem("displayName",name); alert("Display Name disimpan!"); }
  function openPlay(){ document.getElementById("menuScreen").classList.add("hidden"); document.getElementById("leaderboardScreen").classList.add("hidden"); document.getElementById("playScreen").classList.remove("hidden"); document.getElementById("gameFrame").src="pacman.html?"+Date.now(); }
  function openLeaderboard(){ document.getElementById("menuScreen").classList.add("hidden"); document.getElementById("playScreen").classList.add("hidden"); document.getElementById("leaderboardScreen").classList.remove("hidden"); document.getElementById("leaderFrame").src="leaderboard.html?"+Date.now(); }
  function goBack(){ document.getElementById("playScreen").classList.add("hidden"); document.getElementById("leaderboardScreen").classList.add("hidden"); document.getElementById("menuScreen").classList.remove("hidden"); }
  function quitGame(){ window.open("about:blank","_self"); window.close(); }
</script>

<!-- 🎶 Optional Music -->
<!-- <audio autoplay loop src="xmas-music.mp3"></audio> -->

</body>
</html>
