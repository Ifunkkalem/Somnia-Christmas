<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pacman Christmas</title>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; width: 100%;
      font-family: Arial, sans-serif;
    }

    /* 🎄 Border lampu Natal */
    #gameContainer {
      position: relative;
      width: 100%; height: 100%;
      border: 8px solid red;
      border-radius: 15px;
      box-shadow: 0 0 30px green;
      overflow: hidden;
      animation: borderBlink 2s infinite;
    }

    @keyframes borderBlink {
      0% { box-shadow: 0 0 30px red; border-color: red; }
      50% { box-shadow: 0 0 30px yellow; border-color: yellow; }
      100% { box-shadow: 0 0 30px green; border-color: green; }
    }

    /* ❄️ Snow inside game */
    .snow {
      position: absolute;
      top: -10px;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: snowFall linear infinite;
      z-index: 999;
    }

    @keyframes snowFall { from { transform: translateY(0); } to { transform: translateY(120vh); } }

    /* 🎮 Game canvas */
    canvas {
      display: block;
      margin: 0 auto;
      background: #111;
      border-radius: 10px;
    }

    /* Start / pause button */
    #startBtn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, red, green);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px yellow;
      z-index: 1000;
    }

    #startBtn:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 20px red; }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <button id="startBtn">START GAME 🎅</button>
</div>

<!-- ❄️ Snow Effect -->
<script>
  for (let i = 0; i < 50; i++) {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
    snow.style.opacity = Math.random();
    document.body.appendChild(snow);
  }
</script>

<!-- 🎮 Basic Pacman Setup (placeholder) -->
<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // Dummy Pacman drawing
  function drawPacman() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(400, 300, 40, 0.25 * Math.PI, 1.75 * Math.PI);
    ctx.lineTo(400, 300);
    ctx.fill();
  }

  // Start / pause game
  const startBtn = document.getElementById("startBtn");
  let gameInterval;
  startBtn.addEventListener("click", () => {
    if (!gameInterval) {
      gameInterval = setInterval(drawPacman, 1000/30); // 30 FPS
      startBtn.innerText = "PAUSE GAME 🎄";
    } else {
      clearInterval(gameInterval);
      gameInterval = null;
      startBtn.innerText = "RESUME GAME 🎄";
    }
  });
</script>

<!-- 🎶 Optional Christmas Music -->
<!-- <audio autoplay loop src="xmas-music.mp3"></audio> -->

</body>
</html>
