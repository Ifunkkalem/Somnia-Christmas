<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Somnia Pacman</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
  body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  #gameContainer {
    position: relative;
    width: 320px;
    height: 420px;
    border: 2px solid #00ffcc;
    background: #000;
  }

  canvas {
    display: block;
    background: #000;
  }

  #scoreBox {
    position: absolute;
    top: 5px;
    left: 5px;
    font-size: 14px;
    color: #00ffcc;
    z-index: 10;
  }

  /* MOBILE CONTROLS */
  #mobileControls {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 6px;
    z-index: 20;
  }

  #mobileControls button {
    font-size: 22px;
    border-radius: 10px;
    border: none;
    background: #00ffcc;
    color: black;
    font-weight: bold;
  }

</style>
</head>

<body>

<div id="gameContainer">
  <div id="scoreBox">Score: <span id="score">0</span></div>
  <canvas id="game" width="320" height="420"></canvas>

  <!-- MOBILE BUTTONS -->
  <div id="mobileControls">
    <div></div>
    <button onclick="setDir('up')">⬆️</button>
    <div></div>

    <button onclick="setDir('left')">⬅️</button>
    <button onclick="setDir('down')">⬇️</button>
    <button onclick="setDir('right')">➡️</button>
  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

let x = 160;
let y = 200;
let size = 10;
let speed = 2;
let dir = "right";
let score = 0;

// CONTROL FROM MOBILE
function setDir(d){
  dir = d;
}

// CONTROL FROM KEYBOARD
window.addEventListener("keydown", e => {
  if(e.key === "ArrowUp") dir = "up";
  if(e.key === "ArrowDown") dir = "down";
  if(e.key === "ArrowLeft") dir = "left";
  if(e.key === "ArrowRight") dir = "right";
});

function drawPacman(){
  ctx.beginPath();
  ctx.arc(x, y, size, 0.25 * Math.PI, 1.75 * Math.PI);
  ctx.lineTo(x, y);
  ctx.fillStyle = "yellow";
  ctx.fill();
}

function move(){
  if(dir === "up") y -= speed;
  if(dir === "down") y += speed;
  if(dir === "left") x -= speed;
  if(dir === "right") x += speed;

  // WALL LIMIT
  if(x < 10) x = 10;
  if(x > canvas.width - 10) x = canvas.width - 10;
  if(y < 20) y = 20;
  if(y > canvas.height - 10) y = canvas.height - 10;
}

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  move();
  drawPacman();

  score += 1;
  scoreEl.innerText = score;

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
